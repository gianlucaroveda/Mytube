<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyTube</title>

  <!-- Manifest e CSS -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="libreria.css" />

  <!-- ✅ Content Security Policy -->
  <!-- Permette iframe e media da YouTube -->
  <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://www.youtube.com https://www.googleapis.com;
        frame-src https://www.youtube.com https://www.youtube-nocookie.com;
        img-src 'self' https://i.ytimg.com https://yt3.ggpht.com data:;
        connect-src 'self' https://www.googleapis.com;
        style-src 'self' 'unsafe-inline';
      ">
</head>
<body>
 

<main>
      <div id="playerCard" class="card">
        <div id="player"></div>
        <div class="controls">
          <button id="shuffleBtn" class="icon-btn" title="Mischia Playlist">🔀</button>
          <button id="prev">&#x23EE;</button>
          <button id="play">&#x23f8;</button>
          <button id="next">&#x23ED;</button>
          <button id="clearPlaylist">🗑️</button>
        </div>
         <input id="volume" type="range" min="0" max="100" value="50" style="width:100px; margin-left:10px;" color="white"/>
        <br>
        <br>
        
          <ul id="playlistList"></ul>
        

      </div>
    </section>



<!-- OVERLAY MODALE DI RICERCA -->
<div class="modal-overlay" id="search-overlay">
  <div class="app-width">
    <div class="modal">
      <div class="modal-handle"></div>
      
      <!-- Contenitore della ricerca -->
      <div id="searchArea" class="search-area">
        <div class="actions">
          <div class="search-row">
            <input id="searchInput" placeholder="Cerca su YouTube..." />
            <div class="button-column">
              <button id="searchBtn">Video</button>
              <button id="searchPlaylistBtn">Playlist</button>
            </div>
          </div>

          <button id="toggleLinkBtn" class="dots-btn">...</button>

          <div id="linkSearch" class="hidden-link">
            <input id="addUrl" placeholder="Aggiungi per URL o ID" />
            <button id="addBtn">Aggiungi</button>
          </div>
        </div>

        <div id="results" class="results-container">
          <ul id="resultsList"></ul>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- OVERLAY MODALE LIBRERIA -->
<div class="modal-overlay" id="library-overlay">
  <div class="app-width">
    <div class="modal">
      <div class="modal-handle"></div>
      
      <h2 style="margin-bottom: 15px; text-align: center;">La tua Libreria</h2>
      
      <!-- Griglia per i cubotti delle playlist (2 per riga) -->
      <div id="libraryGrid" class="library-grid">
        <!-- Generato dinamicamente via JS -->
      </div>

    </div>
  </div>
</div>

<!-- MODALE SELEZIONE GRAFICA PLAYLIST -->
<div id="select-playlist-overlay" class="modal-overlay">
  <div class="modal-content select-playlist-content">
    <div class="modal-header">
      <h3>Aggiungi a...</h3>
      <button id="close-select-playlist-btn" class="close-btn">&times;</button>
    </div>
    <div id="select-playlist-grid" class="select-playlist-grid">
      <!-- I cubotti/schede delle playlist verranno generati qui dinamicamente -->
    </div>
  </div>
</div>


<!-- OVERLAY MODALE MODIFICA PLAYLIST -->
<div class="modal-overlay" id="edit-overlay">
  <div class="app-width">
    <div class="modal">
      <div class="modal-handle"></div>

      <div id="editArea" class="search-area">
        <div class="actions">
          <div class="search-row">
            <input id="editPlaylistName" placeholder="Nome playlist" />
            <div class="button-column">
              <button id="editSaveNameBtn">Rinomina</button>
            </div>
          </div>
        </div>

        <div id="editResults" class="results-container">
          <ul id="editResultsList"></ul>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="randomizer-overlay">
  <div class="app-width">
    <div class="modal">
      <div class="modal-handle"></div>

      <div class="modal-header">
        <h3>🎲 Mix & Strumenti</h3>
      </div>

      <!-- Sezione 1: Chiave API -->
      <div class="randomizer-section">
        <div class="section-title">Impostazioni API</div>
        <button id="modifyBtn" class="action-btn-key">🔑 Gestisci Chiave API</button>
        <button id="saveLocal">💾</button>
      </div>

      <!-- Sezione 2: Daily Mix -->
      <div class="randomizer-section">
        <div class="section-title">I tuoi Daily Mix</div>
        <div id="dailyMixGrid" class="daily-mix-grid">
          <!-- Cubotto per creare un nuovo Mix -->
          <div id="createMixCard" class="mix-card create-card">
            <span class="plus-icon">+</span>
            <span>Crea Daily Mix</span>
          </div>
          <!-- I cubotti dei Daily Mix salvati appariranno qui dinamicamente -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 4. MODALE SELEZIONE PLAYLIST PER DAILY MIX -->
<div class="modal-overlay" id="mix-select-overlay">
  <div class="app-width">
    <div class="modal">
      <div class="modal-handle"></div>

      <div class="modal-header">
        <h3>Seleziona Playlist per il Mix</h3>
      </div>
      
      <div class="mix-input-group">
        <input type="text" id="mixNameInput" placeholder="Nome del Mix (es. Relax & Rock)" />
      </div>

      <div id="mixPlaylistChecklist" class="mix-checklist">
        <!-- Lista di checkbox generate dinamicamente -->
      </div>

      <button id="saveMixBtn" class="action-btn-save">🎲 Genera & Salva Mix</button>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="fixed-footer">
  <button class="footer-btn" id="footer-home-btn">Home</button>
  <button class="footer-btn" id="footer-search-btn">Cerca</button>
  <button class="footer-btn" id="footer-library-btn">Libreria</button>
  <button class="footer-btn" id="footer-profile-btn">Profilo</button>
</footer>


  <!-- YouTube API + script -->
  <script src="playlist.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
  <script src="app1.js" ></script>
  <script src="animation.js" ></script>
  <script src="cerca.js" ></script>
  <script src="libreria.js" ></script>



<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker Registrato!', reg))
        .catch(err => console.error('Errore SW:', err));
    });
  }
</script>

</body>
</html>
